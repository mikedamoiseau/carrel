# Advisories that are accepted rather than fixed, read by `cargo audit`
# (the "Advisories" gate in CLAUDE.md's gate table, and the `Cargo Audit`
# job in ci.yml). Anything NOT listed here fails the gate, so this file is
# the whole mute list — keep a reason and an exit condition on every entry,
# and delete an entry the moment its exit condition is met.
#
# Warnings (unmaintained / unsound / yanked) are reported but do not fail
# the gate, so they are deliberately not listed. Most are the gtk-rs GTK3
# bindings that `tauri` pulls on Linux and that nobody upstream will
# revive; muting them here would only hide the day one of them becomes a
# real advisory.

[advisories]
ignore = [
    # quick-xml: unbounded namespace-declaration allocation (RUSTSEC-2026-0195,
    # 7.5 high) and quadratic duplicate-attribute checking (RUSTSEC-2026-0194).
    # Both are memory/CPU exhaustion on malformed XML, both fixed in 0.41.0.
    #
    # Our own XML parsing — the EPUB OPF/NCX reader in `carrel-core::epub` and
    # the OPDS reader in `carrel-core::opds`, i.e. every path that sees an
    # untrusted book — is already on 0.41.0, because the workspace requires
    # `quick-xml = "0.41"`. A caret requirement cannot resolve below 0.41.0,
    # so muting these two advisories cannot hide a regression of our own
    # parser; it would take a manifest edit, which is a visible diff.
    #
    # The three affected trees are all transitive and none of them parse book
    # content:
    #   0.37.5  <- reqsign <- opendal        (AWS SigV4; parses S3 responses)
    #   0.38.4  <- opendal, and plist <- tauri (S3/WebDAV responses; Info.plist)
    #   0.39.2  <- wayland-scanner           (Linux build script, parses the
    #                                         protocol XML shipped in-crate,
    #                                         i.e. trusted, at build time only)
    #
    # Exit condition: opendal and tauri bump their quick-xml. Nothing we can
    # do from here short of vendoring them.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # suppaftp 6.3.0: FTP command injection via CRLF in control-channel
    # arguments. Fixed in suppaftp 10.0.2, which no *usable*
    # `opendal` pulls. Per crates.io's dependency API, `opendal-service-ftp`
    # requires:
    #   0.55, 0.56  ->  suppaftp ^6.3.0   (vulnerable)
    #   0.57, 0.58  ->  suppaftp ^8.0.3   (vulnerable; resolves to 8.0.5)
    #   0.59.0      ->  suppaftp ^10.0.2  (fixed)
    # and 0.59.0 does not compile from crates.io at all: `opendal-core`
    # 0.59.0's `src/docs/mod.rs` carries an unconditional
    # `#[doc = include_str!("../../../CHANGELOG.md")]`, `pub mod docs;` is not
    # feature-gated, and no CHANGELOG.md is present anywhere in the published
    # 243-file tarball. So the one release that fixes this is unbuildable and
    # there is no version to upgrade to.
    #
    # We do reach this code: `services-ftp` is enabled and `ProviderType::Ftp`
    # is a user-selectable backup provider (`carrel-core/src/backup.rs`).
    #
    # Mitigated at our own boundary instead of in the transport: the remote
    # object paths we hand opendal are built by `remote_file_path` /
    # `remote_cover_path`, which bound the only attacker-influenced component
    # (a book's file extension, read off a filename on disk) to a plain
    # alphanumeric run. The FTP endpoint/user/password/root fields are also
    # concatenated into control-channel traffic, but those come from the
    # install's own backup settings — the only person who can inject there is
    # the person configuring their own backup.
    #
    # Exit condition: an `opendal` release that both compiles and pulls
    # suppaftp >= 10.0.2. Re-check on every opendal release; drop this entry
    # and keep the path bounds (they are correct independently of suppaftp).
    "RUSTSEC-2026-0271",

    # zip 2.4.2: three advisories, all in whole-archive extraction —
    # SUID/SGID bits preserved (RUSTSEC-2026-0367), symlinks with targets
    # outside the destination (RUSTSEC-2026-0368), and Unix permissions
    # applied through such symlinks (RUSTSEC-2026-0369, 9.1 critical). The
    # affected functions are `ZipArchive::extract` and
    # `ZipStreamReader::extract`. Fixed in zip 9.0.0.
    #
    # We never call either. Every read in `carrel-core` (epub, cbz,
    # page_cache) and `src-tauri` goes entry by entry through
    # `by_index` / `by_name` / `by_index_raw` into a capped `Read::take`, and
    # writes go to paths we build ourselves (cache keys, sanitized
    # basenames), never to an entry's own name or mode. No other crate in the
    # tree depends on zip. Check: `grep -rnE "\.extract\(|ZipStreamReader"
    # carrel-core/src src-tauri/src` finds nothing.
    #
    # Not upgraded yet because 9.x is not a drop-in: `ZipFile::name()` now
    # returns `ZipResult<Cow<str>>` and decodes any valid-UTF-8 name as UTF-8
    # even without the UTF-8 flag (2.x read unflagged names as CP437), which
    # can reorder a comic's pages under an existing page cache; and
    # `ZipArchive` appears in carrel-core's public API
    # (`epub::validate_archive`), which Carrel Server consumes. See
    # docs/backlog/zip-9-upgrade.md.
    #
    # Exit condition: the zip 9 upgrade lands. Also drop this entry at once
    # if anything starts calling `extract`.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",

    # zstd 0.13.3 / zstd-safe 7.2.4 / zstd-sys 2.0.16: four advisories
    # (fixed in zstd 0.14.3, zstd-safe 8.2.0, zstd-sys 2.1.2). zstd reaches
    # the tree only through zip 2.4.2's default `zstd` feature, which zip
    # pins to `zstd = "0.13"`, so no upgrade is possible short of zip itself.
    # Nothing in carrel-core or src-tauri uses zstd directly. Check:
    # `grep -rn zstd carrel-core/src src-tauri/src` finds nothing.
    #
    # The only zstd code zip runs is reading a zstd-compressed entry, via
    # `zstd::Decoder::with_buffer` (zip-2.4.2 src/compression.rs:245) — the
    # read decoder, built on a fresh context per entry. None of the four is
    # on that path:
    #   RUSTSEC-2026-0391  data leaks between streams on a context reused via
    #                      `with_context`; zip never reuses one (zstd-0.13.3
    #                      src/stream/raw.rs:146 creates it).
    #   RUSTSEC-2026-0403  uninitialized memory from a failed legacy-frame
    #                      decode; affects `stream::write::Decoder` only, and
    #                      zip builds zstd with `default-features = false`, so
    #                      legacy support is not compiled in.
    #   RUSTSEC-2026-0398  `Seekable::decompress`; the `seekable` feature is
    #                      off.
    #   RUSTSEC-2026-0410  wasm32 allocator shim; we build no wasm target.
    #
    # Exit condition: a zip upgrade that pulls zstd >= 0.14.3 (see
    # docs/backlog/zip-9-upgrade.md). Drop at once if anything starts using
    # zstd directly, enables its `legacy`/`seekable` features, or targets
    # wasm32.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
    "RUSTSEC-2026-0410",
]
