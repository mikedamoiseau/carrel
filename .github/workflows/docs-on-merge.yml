name: Docs on merge

# When a PR is merged into main, classify the change and keep Carrel's in-repo
# Markdown docs in sync: CHANGELOG.md, README.md, and docs/USER_GUIDE.md.
#
# The website + published docs on damoiseau.xyz are NOT this workflow's concern.
# That site lives in a separate repo with its own Claude Code agent that pulls
# Carrel's latest changes on a schedule and updates its documentation itself. This
# workflow therefore touches in-repo docs ONLY and produces no website handoff.
#
# Auth: subscription OAuth token, NOT an API key.
#   1) Run `claude setup-token` locally (one-year token tied to your Team seat).
#   2) Add it as a repo secret named CLAUDE_CODE_OAUTH_TOKEN.
#   3) It's referenced below instead of anthropic_api_key.

on:
  pull_request:
    types: [closed]
    branches: [main]

# Don't let two runs for the same PR overlap.
concurrency:
  group: docs-on-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync-docs:
    # Run ONLY on a real merge (not a plain close), skip bot-authored PRs, and
    # skip the routine's own follow-up docs PR (titled "docs: ...") so it can't
    # trigger itself in a loop.
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.type != 'Bot' &&
      github.actor != 'claude[bot]' &&
      !startsWith(github.event.pull_request.title, 'docs:')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # push the docs/pr-N branch
      pull-requests: write   # read the merged PR, open the docs PR, comment
      id-token: write        # token minting for the action
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The agent gets no shell. Everything it needs from GitHub is fetched
      # here, and everything it produces is published by the last step, so a
      # PR description or diff can steer its prose but not a command.
      - name: Fetch the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .pr-context
          gh pr view "$PR" --json number,title,body,author,labels,files > .pr-context/pr.json
          gh pr diff "$PR" > .pr-context/diff.patch

      - name: Draft release notes and sync docs
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Edit,Write"
            --disallowedTools "Bash"
          # Temporary: surface the agent's final report in the Step Summary so a
          # no-op success (no docs PR opened) is diagnosable. Full turn-by-turn
          # output stays off: the repo is public and it includes every tool result.
          display_report: true
          show_full_output: false
          prompt: |
            A pull request was just merged into main of Carrel, a local-first
            desktop app (Tauri + Rust + React) for reading and organizing EPUB,
            MOBI / AZW / AZW3, PDF, CBZ, and CBR — supported platforms are macOS,
            Windows, and Linux. The desktop app also serves a built-in web reader
            (any browser on the same network, including phones and tablets) and an
            OPDS catalog, so a change may be desktop-only, web-reader-only, or both.

            Merged PR: #${{ github.event.pull_request.number }}
            Title: "${{ github.event.pull_request.title }}"

            Follow the project's CLAUDE.md conventions throughout. Keep the in-repo
            documentation surfaces below in sync. Leave the website alone — the
            damoiseau.xyz site is maintained by its own agent that pulls this repo
            on a schedule; you produce in-repo doc edits only, no website handoff.

            You have no shell. The PR is already fetched into `.pr-context/`, and a
            later workflow step publishes your work, so your job is editing files:
            CHANGELOG.md, README.md, docs/USER_GUIDE.md, and the output files in
            step 7.

            1. Read the PR: `.pr-context/pr.json` (title, description, author,
               labels, changed files) and `.pr-context/diff.patch`. Identify the
               user-visible change and classify it: New, Improved, Fixed, Breaking,
               or Internal-only.

            2. If the change is internal-only (tests, CI, build tooling, comments,
               dead-code removal, pure refactors, dependency bumps with no user
               impact), write `internal` to `.pr-context/classification` and stop
               there. The workflow comments "Internal change — no docs update." on
               the PR.

            3. Otherwise, draft one canonical entry, written for end users (people
               reading books in the app), not contributors:
               - A short paragraph in plain language. No jargon, internal codenames,
                 file paths, function names, or commit SHAs.
               - If the change behaves differently or is only available on some
                 platforms (macOS / Windows / Linux), say which.
               - If it's a Breaking change, list exactly what users must do to
                 migrate.
               This canonical entry is the source you adapt below. Write it well once.

            4. Edit the in-repo docs:
               - CHANGELOG.md — one terse line under the matching heading
                 (New / Improved / Fixed / Breaking) in the Unreleased/top section.
                 Match the file's existing Keep a Changelog style.
               - README.md — update only if the change alters Carrel's headline
                 capabilities. If so, slot it into the correct "Highlights"
                 subsection (Reading / Library / Catalogs, metadata, and backup).
                 Skip README for minor fixes. Keep the feature list accurate, not noisy.
               - docs/USER_GUIDE.md — add or revise the how-to: where the feature
                 lives in the UI and the steps to use it. Be as thorough as needed;
                 the brevity rule does not apply to this file.

            5. Voice per surface: changelog = terse imperative ("Add…", "Fix…");
               user guide = second-person instructional ("To …, open …").

            6. If any doc surface claims a capability the code doesn't have, don't
               silently delete it — flag the drift in the PR description so a human
               can decide.

            7. Output: write the classification (New, Improved, Fixed, or Breaking)
               to `.pr-context/classification`, and the docs PR's description to
               `.pr-context/pr-body.md`: the canonical entry, its classification,
               affected platforms, the list of in-repo files changed, and any drift
               flagged in step 6. The workflow commits only CHANGELOG.md, README.md,
               and docs/USER_GUIDE.md to a `docs/pr-${{ github.event.pull_request.number }}`
               branch and opens the PR.

            Keep the changelog and README entries short — long notes don't get read.
            The user guide is the one place to be thorough.

      # Deterministic publishing: comment, or branch + commit + push + PR. The
      # PR title starts with "docs:", which is what keeps this workflow from
      # re-triggering on its own PR (see the job's `if:`). A PR opened with
      # this job's token doesn't trigger CI on its own; the docs PR is docs-only.
      - name: Publish the docs PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          class="$(tr -d '[:space:]' < .pr-context/classification 2>/dev/null | tr '[:upper:]' '[:lower:]' || true)"
          if [ "$class" = "internal" ]; then
            gh pr comment "$PR" --body "Internal change — no docs update."
            exit 0
          fi
          docs=(CHANGELOG.md README.md docs/USER_GUIDE.md)
          if git diff --quiet -- "${docs[@]}"; then
            echo "::warning::No doc changes for #$PR (classification: ${class:-none}); nothing to publish."
            exit 0
          fi
          branch="docs/pr-$PR"
          git switch -c "$branch"
          git add -- "${docs[@]}"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "docs: sync docs for #$PR"
          # Push with this job's own token, explicitly: the action reconfigures
          # git auth for its app token, which it revokes when it finishes.
          git -c http.https://github.com/.extraheader= \
              push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:refs/heads/$branch"
          [ -s .pr-context/pr-body.md ] || printf 'Docs sync for #%s.\n' "$PR" > .pr-context/pr-body.md
          gh pr create --base main --head "$branch" \
            --title "docs: sync docs for #$PR" --body-file .pr-context/pr-body.md

# ---------------------------------------------------------------------------
# WEBSITE (damoiseau.xyz) — NOT handled here, by design.
#
# The website lives in a separate repo with its own Claude Code agent that pulls
# Carrel's latest changes on a schedule and updates the published docs itself.
# This workflow commits in-repo Markdown only (CHANGELOG / README / USER_GUIDE)
# and never edits website files, emits a handoff brief, or opens a cross-repo PR.
# No Bitbucket credentials or cross-platform API calls live in this repo.
# ---------------------------------------------------------------------------
