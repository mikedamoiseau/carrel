name: Release

on:
  push:
    tags:
      - 'v*'

env:
  # Pin to a specific chromium build. Update to latest from:
  # https://github.com/bblanchon/pdfium-binaries/releases
  PDFIUM_VERSION: "7763"
  # Pinned libmobi commit. The Windows build path compiles libmobi
  # from source (the project has CMake support since v0.10 — see
  # https://github.com/bfabiszewski/libmobi/blob/v0.12/CMakeLists.txt).
  #
  # Pinned to a full commit SHA rather than a moving tag so a
  # retargeted tag (or upstream takeover) cannot silently change the
  # source CMake runs against on a cache miss. The drift test in
  # `src-tauri/src/release_workflow_test.rs` enforces that this value
  # matches the equivalent pin in `ci.yml`. Bumping this invalidates
  # the libmobi cache (key includes the SHA) so the next CI run
  # rebuilds against the new revision.
  #
  # Current pin: tag v0.12 (https://github.com/bfabiszewski/libmobi/releases/tag/v0.12)
  LIBMOBI_VERSION: "85dcfe803fc2a21020ddcf15c3eb66b93d388add"

jobs:
  publish-tauri:
    name: Build & Release (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux + macOS: enable the mobi feature so MOBI/AZW/AZW3 import
          # is compiled in. Windows stays on --no-default-features; see
          # docs/USER_GUIDE.md for the platform support matrix.
          #
          # Linux carries an extra `--config tauri.linux.mobi.conf.json`
          # which overlays the `libmobi0` / `libmobi` depends into the
          # `.deb` / `.rpm` packages. The overlay is only applied when
          # `--features mobi` is on, so a hypothetical non-mobi Linux
          # build would ship honest metadata (no unneeded depends).
          - platform: ubuntu-latest
            args: '--config src-tauri/tauri.linux.mobi.conf.json --features mobi'
            pdfium_archive: pdfium-linux-x64.tgz
            pdfium_lib: libpdfium.so
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --features mobi'
            pdfium_archive: pdfium-mac-univ.tgz
            pdfium_lib: libpdfium.dylib
          # macos-latest runners are arm64, so Homebrew installs an
          # arm64 libmobi.dylib that can't be linked into an x86_64
          # target. Ship x86_64 Mac without MOBI rather than adding a
          # universal-libmobi build pipeline just for Intel Macs; arm64
          # Mac users keep full MOBI support. See release note below.
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            pdfium_archive: pdfium-mac-univ.tgz
            pdfium_lib: libpdfium.dylib
          # Windows: --no-default-features drops the sftp feature (the
          # services-ftp transitive dep does not build cleanly under
          # MSVC at the moment). `--features mobi` re-enables MOBI/AZW/
          # AZW3 import — libmobi is built from source as a static
          # archive (`mobi.lib`, no DLL) earlier in the job and linked
          # directly into carrel.exe. See `windows_libmobi_build_is_static`
          # in src-tauri/src/release_workflow_test.rs for why static.
          - platform: windows-latest
            args: '-- --no-default-features --features mobi'
            pdfium_archive: pdfium-win-x64.tgz
            pdfium_lib: pdfium.dll

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libmobi-dev

      # libmobi (LGPL) is required for the `mobi` feature. We build it from
      # source as a STATIC archive and bake it into the binary — mirroring
      # the Windows path — so the shipped .app is self-contained. Previously
      # the arm64 Mac build dynamically linked Homebrew's libmobi at the
      # absolute path /opt/homebrew/opt/libmobi/lib/libmobi.0.dylib, so every
      # user without `brew install libmobi` got a dyld "Library not loaded"
      # crash on launch.
      #
      # USE_ZLIB=OFF / USE_LIBXML2=OFF select libmobi's bundled miniz and
      # internal xmlwriter, avoiding any external runtime dependency. CMake
      # compiles miniz only for its CLI tools (not into libmobi.a), so — as on
      # Windows — we compile miniz.c ourselves and merge it into the archive
      # with `libtool -static`, otherwise `_mz_crc32` / `_mz_uncompress` are
      # undefined at link time. Only the arm64 Mac entry enables MOBI; the
      # x86_64 entry ships without it (see matrix comment above).
      - name: Build libmobi (macOS, static)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64-apple-darwin')
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/libmobi-src"
          OUT="${GITHUB_WORKSPACE}/.libmobi-macos"
          git clone --quiet https://github.com/bfabiszewski/libmobi.git "$SRC"
          git -C "$SRC" checkout --quiet "${LIBMOBI_VERSION}"
          cmake -S "$SRC" -B "$SRC/build" \
            -DBUILD_SHARED_LIBS=OFF -DUSE_ZLIB=OFF -DUSE_LIBXML2=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          # Build only the `mobi` library target — the bundled CLI tools
          # (e.g. mobidrm) don't link cleanly with miniz excluded and we
          # don't ship them.
          cmake --build "$SRC/build" --target mobi --config Release
          cc -O2 -arch arm64 -I "$SRC/src" -c "$SRC/src/miniz.c" -o "$SRC/miniz.o"
          mkdir -p "$OUT/lib" "$OUT/include"
          libtool -static -o "$OUT/lib/libmobi.a" "$SRC/build/src/libmobi.a" "$SRC/miniz.o"
          cp "$SRC/src/mobi.h" "$OUT/include/"

      # libmobi has no Windows package in vcpkg or any other registry
      # we ship against, but it does have first-class CMake support
      # (since v0.10) so we build a DLL from source on the runner.
      # USE_ZLIB=OFF / USE_LIBXML2=OFF picks libmobi's bundled miniz
      # and internal xmlwriter, avoiding any external dependency the
      # MSVC toolchain would otherwise need from vcpkg.
      #
      # The cache key includes both LIBMOBI_VERSION and the target
      # arch so a pin bump or arch change invalidates automatically.
      # Cache miss costs ~1–2 min on a stock windows-latest runner;
      # cache hit is a few seconds.
      #
      # The `if:` gate also requires `--features mobi` to be in the
      # Windows matrix args. Until that flip lands (W3), the libmobi
      # build is dormant on the release runner — staging the wiring
      # without burning CI minutes or adding a failure point that
      # produces no shipped artifact. PR-CI's `test-mobi-windows`
      # job (ci.yml) exercises the build path on every PR, so this
      # gate does not reduce coverage.
      # MSVC dev environment for direct `lib.exe` invocation. CMake
      # loads this internally for its own builds, but the post-build
      # merge step below (which archives miniz objs into mobi.lib)
      # spawns `lib.exe` from a plain pwsh shell, where MSVC tools
      # are not on PATH unless explicitly set up.
      - name: Set up MSVC dev environment (Windows)
        if: matrix.platform == 'windows-latest' && contains(matrix.args, '--features mobi')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache libmobi (Windows)
        if: matrix.platform == 'windows-latest' && contains(matrix.args, '--features mobi')
        id: cache-libmobi-windows
        uses: actions/cache@v5
        with:
          path: .libmobi-windows
          # Suffix encodes the build flavor (link kind + which optional
          # deps are off). If we ever flip BUILD_SHARED_LIBS or re-enable
          # zlib/libxml2 without bumping LIBMOBI_VERSION, the cache key
          # changes too — preventing a stale cache from masquerading as
          # a fresh build of the new flavor.
          key: libmobi-${{ env.LIBMOBI_VERSION }}-windows-x64-static-nozlib-nolibxml2-v1

      - name: Build libmobi (Windows)
        if: matrix.platform == 'windows-latest' && contains(matrix.args, '--features mobi') && steps.cache-libmobi-windows.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $src = "$env:RUNNER_TEMP\libmobi-src"
          $build = "$env:RUNNER_TEMP\libmobi-build"
          $prefix = "$env:GITHUB_WORKSPACE\.libmobi-windows"
          # Clone + checkout-by-SHA rather than `--branch <ref>`:
          # `git clone --branch` does not accept commit SHAs, and we
          # pin SHAs (not tags) to keep the upstream source bytes
          # immutable. Verify after checkout so a clone-time race
          # between `git clone` and `git checkout` cannot land us on
          # a different revision than the pinned one.
          git clone https://github.com/bfabiszewski/libmobi.git $src
          git -C $src checkout "$env:LIBMOBI_VERSION"
          $head = git -C $src rev-parse HEAD
          if ($head.Trim() -ne $env:LIBMOBI_VERSION) {
            throw "libmobi checkout drifted: expected $env:LIBMOBI_VERSION, got $head"
          }
          # BUILD_SHARED_LIBS=OFF produces a static `mobi.lib` archive
          # (no DLL). With USE_ZLIB=OFF + USE_LIBXML2=OFF the archive
          # is fully self-contained, so `cargo:rustc-link-lib=static=
          # mobi` (carrel-core/build.rs) bakes libmobi into carrel.exe
          # without any runtime DLL dependency. This avoids the
          # Tauri-bundler complications of placing a DLL where the
          # OS loader will find it next to the installed binary.
          # No `-G` — see the matching step in ci.yml. The generator is
          # left to CMake (newest installed Visual Studio) because the
          # runner image, not this workflow, owns the VS version: the
          # `windows-2025-vs2026` image rollout on 2026-08-17 dropped
          # VS 2022 and broke the pinned `-G "Visual Studio 17 2022"`.
          cmake -B $build -S $src `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DUSE_LIBXML2=OFF `
            -DUSE_ZLIB=OFF `
            -DCMAKE_INSTALL_PREFIX="$prefix"
          # Build everything and tolerate a non-zero exit from
          # cmake --build. libmobi's `tools/` subdirectory produces
          # CLI binaries (mobitool, mobidrm, mobimeta) that depend on
          # `getopt` (unavailable on MSVC) and on miniz symbols that
          # don't satisfy under `USE_ZLIB=OFF`. Carrel doesn't ship
          # those tools, so their link failure is expected and not
          # a release-blocker.
          #
          # We can't `--target mobi` instead because libmobi's
          # `miniz` is declared as a CMake OBJECT library, which the
          # MSBuild generator doesn't surface as a standalone
          # `.vcxproj`. Explicitly targeting `miniz` errors with
          # `MSBUILD : error MSB1009: Project file does not exist.
          # Switch: miniz.vcxproj`. Building everything is the only
          # way to get MSBuild to compile the miniz objects we need
          # to merge into mobi.lib below.
          #
          # `$PSNativeCommandUseErrorActionPreference = $false` on
          # this single statement keeps GitHub Actions' default
          # "throw on native non-zero exit" from blocking the rest
          # of the script. The post-build verification is `mobi.lib
          # exists`, which is the property we actually care about.
          $oldPref = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          cmake --build $build --config Release --parallel
          $PSNativeCommandUseErrorActionPreference = $oldPref
          if (-not (Test-Path "$build\src\Release\mobi.lib")) {
            throw "cmake --build did not produce mobi.lib (tools/ link failures are expected; mobi.lib being absent is not)"
          }
          # libmobi's CMake declares miniz as an OBJECT library and
          # links it `PRIVATE` into the mobi target. CMake's normal
          # path expects the consumer to also be a CMake target, in
          # which case the miniz object files are added to the
          # consumer's link line automatically. Carrel's consumer is
          # cargo (not CMake), so when rustc links the static
          # `mobi.lib` it sees `mobi.lib(util.obj)` referencing
          # `mz_uncompress` / `mz_crc32` with no archive providing
          # them — `lib.exe` does not pull OBJECT-library objects
          # into a STATIC `.lib` on its own.
          #
          # Fix: archive the miniz object file into `mobi.lib` so the
          # static archive is genuinely self-contained. `lib /OUT:foo
          # foo objs…` rebuilds `foo` with its existing members plus
          # the new ones.
          # Search the whole build tree because libmobi has TWO
          # places that compile miniz.c: the `miniz` OBJECT lib in
          # `src/CMakeLists.txt` (links into `mobi`) and the `zip`
          # OBJECT lib in `tools/CMakeLists.txt` (links into the CLI
          # tools). With CMake's MSBuild generator the `miniz` target
          # may not actually emit an `.obj` (OBJECT libs aren't
          # always built when they're only linked by another target),
          # so we accept either compile output — both define the
          # same `mz_uncompress` / `mz_crc32` symbols mobi.lib needs.
          $minizObj = Get-ChildItem "$build" -Recurse -Filter "miniz*.obj" | Select-Object -First 1
          if ($null -eq $minizObj) {
            Write-Host "build tree contents (debug):"
            Get-ChildItem "$build" -Recurse -Filter "*.obj" | Select-Object -ExpandProperty FullName
            throw "Could not locate built miniz object file under $build — libmobi CMake layout changed?"
          }
          Write-Host "Merging $($minizObj.FullName) into mobi.lib"
          & lib /NOLOGO "/OUT:$build\src\Release\mobi.lib" "$build\src\Release\mobi.lib" $minizObj.FullName
          if ($LASTEXITCODE -ne 0) { throw "lib.exe failed merging miniz into mobi.lib (exit $LASTEXITCODE)" }
          # libmobi v0.12 defines no `install()` rules in any of its
          # CMakeLists, so `cmake --install` is a no-op. Copy the
          # static archive and the public header into the install
          # prefix by hand. (`mobi.h` only includes standard C headers
          # — stdio.h, stdint.h, stdbool.h, time.h — so we don't have
          # to ship libmobi's private headers alongside it.)
          New-Item -ItemType Directory -Force -Path "$prefix\lib", "$prefix\include" | Out-Null
          Copy-Item "$build\src\Release\mobi.lib" "$prefix\lib\mobi.lib"
          Copy-Item "$src\src\mobi.h" "$prefix\include\mobi.h"
          Write-Host "libmobi installed: $prefix"

      # Runs on both cache hit and cache miss so a corrupted or
      # mis-flavored cache (e.g. someone manually edited the cache key
      # without bumping the suffix) fails loudly rather than letting
      # the Tauri build link against the wrong artifact.
      - name: Verify libmobi artifacts (Windows)
        if: matrix.platform == 'windows-latest' && contains(matrix.args, '--features mobi')
        shell: pwsh
        run: |
          $prefix = "$env:GITHUB_WORKSPACE\.libmobi-windows"
          $expectedLib = Join-Path $prefix "lib\mobi.lib"
          $expectedHdr = Join-Path $prefix "include\mobi.h"
          $expectedDll = Join-Path $prefix "bin\mobi.dll"
          foreach ($p in @($expectedLib, $expectedHdr)) {
            if (-not (Test-Path $p)) {
              throw "libmobi artifact missing: $p — cache flavor mismatch?"
            }
          }
          # We build static (BUILD_SHARED_LIBS=OFF), so a DLL appearing
          # in the prefix means a previous shared-build cache leaked
          # in under a key that should not have matched.
          if (Test-Path $expectedDll) {
            throw "Unexpected mobi.dll at $expectedDll — cache contains a shared (DLL) build, but the release expects a static (mobi.lib) one. Bump the cache-key suffix."
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache pdfium
        id: cache-pdfium
        uses: actions/cache@v5
        with:
          path: src-tauri/resources
          key: pdfium-${{ env.PDFIUM_VERSION }}-${{ matrix.pdfium_archive }}

      - name: Download pdfium (Unix)
        if: steps.cache-pdfium.outputs.cache-hit != 'true' && matrix.platform != 'windows-latest'
        shell: bash
        run: |
          mkdir -p src-tauri/resources /tmp/pdfium-extracted
          curl -L -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F${{ env.PDFIUM_VERSION }}/${{ matrix.pdfium_archive }}"
          tar xzf /tmp/pdfium.tgz -C /tmp/pdfium-extracted
          cp /tmp/pdfium-extracted/lib/${{ matrix.pdfium_lib }} src-tauri/resources/

      - name: Download pdfium (Windows)
        if: steps.cache-pdfium.outputs.cache-hit != 'true' && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources
          $tmp = "$env:TEMP\pdfium-extracted"
          New-Item -ItemType Directory -Force -Path $tmp
          Invoke-WebRequest `
            -Uri "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F${{ env.PDFIUM_VERSION }}/${{ matrix.pdfium_archive }}" `
            -OutFile "$env:TEMP\pdfium.tgz"
          tar xzf "$env:TEMP\pdfium.tgz" -C $tmp
          Copy-Item "$tmp\bin\${{ matrix.pdfium_lib }}" src-tauri/resources/

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Aptabase usage-analytics app key, baked in at compile time
          # (option_env! in src-tauri/src/analytics.rs). Client-side by design
          # (not a secret), so a repo Actions *variable* is fine. When unset the
          # SDK is disabled and no analytics are ever sent — so builds without
          # this configured simply ship analytics-off.
          CARREL_APTABASE_KEY: ${{ vars.CARREL_APTABASE_KEY }}
          # carrel-core/build.rs uses pkg-config first, then falls back to
          # LIBMOBI_INCLUDE_DIR / LIBMOBI_LIB_DIR. Neither Windows (MSVC) nor
          # the macOS runner (no brew libmobi) has libmobi on the pkg-config
          # path, so the fallback is the exercised path on both. On Linux
          # these are empty strings — pkg-config takes over via libmobi-dev —
          # and `Option::filter` in the build script ignores empty paths.
          #
          # LIBMOBI_STATIC forces static linkage in build.rs (Windows already
          # forces it unconditionally; arm64 macOS opts in here so it links
          # the from-source `libmobi.a` built above instead of a dylib).
          LIBMOBI_STATIC: ${{ (matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64-apple-darwin')) && '1' || '' }}
          LIBMOBI_INCLUDE_DIR: ${{ matrix.platform == 'windows-latest' && format('{0}\.libmobi-windows\include', github.workspace) || (contains(matrix.args, 'aarch64-apple-darwin') && format('{0}/.libmobi-macos/include', github.workspace) || '') }}
          LIBMOBI_LIB_DIR: ${{ matrix.platform == 'windows-latest' && format('{0}\.libmobi-windows\lib', github.workspace) || (contains(matrix.args, 'aarch64-apple-darwin') && format('{0}/.libmobi-macos/lib', github.workspace) || '') }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Carrel ${{ github.ref_name }}'
          releaseBody: |
            See the assets below to download and install this version.

            > **macOS note:** Due to macOS security policy, the first launch may show a "damaged" or "unidentified developer" warning even though the download is intact. The DMG includes **Read Me First.txt** and **Open Carrel.command** to take care of the required setup, or see the [installation guide](https://github.com/mikedamoiseau/carrel/blob/main/docs/USER_GUIDE.md#installing) for the Terminal command.
            >
            > **MOBI / AZW / AZW3 support:** MOBI import is included on Linux, arm64 macOS, and Windows. The arm64 macOS and Windows builds statically link libmobi, so no extra install is needed. Linux dynamically links against libmobi — install it before first MOBI open with `sudo apt install libmobi0` (Debian / Ubuntu). EPUB / PDF / CBZ / CBR do not need libmobi. The x86_64 (Intel) macOS build does not include MOBI support — use a different format on that platform.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Tauri's DMG configuration has no option for arbitrary top-level
      # files. Rebuild each macOS DMG with the version-controlled first-run
      # helper and read-me, then replace the asset tauri-action just uploaded.
      # This stays out of Carrel.app itself (which cannot run until Gatekeeper
      # lets it launch) and out of the Windows/Linux packages entirely.
      - name: Add first-run help to macOS DMG
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as environment values, never interpolated into the script
          # body: a tag name is attacker-chosen text as far as the shell is
          # concerned, and `${{ }}` inside `run:` is textual substitution.
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dmg_count="$(find target -type f -path '*/release/bundle/dmg/*.dmg' | wc -l | tr -d ' ')"
          if [[ "$dmg_count" != "1" ]]; then
            echo "Expected exactly one macOS DMG, found $dmg_count" >&2
            exit 1
          fi
          dmg_path="$(find target -type f -path '*/release/bundle/dmg/*.dmg' -print -quit)"
          ./scripts/add-macos-dmg-help.sh "$dmg_path"
          gh release upload "$RELEASE_TAG" "$dmg_path" \
            --repo "$RELEASE_REPO" --clobber
