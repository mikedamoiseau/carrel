[workspace]
resolver = "2"
members = [
    "carrel-core",
    "src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "3.1.0"

[workspace.dependencies]
# Error / serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Misc utilities used across crates
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "5"
sha2 = "0.10"
regex = "1"
url = "2"
urlencoding = "2"
# dictionary.rs (F-1-1): decompress the gzipped WordNet artifact on install.
flate2 = "1"
log = "0.4.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
tracing-appender = "0.2"
# keyring 3 ships NO default backend — every platform store is feature-gated,
# and with none enabled the crate silently resolves to its in-memory *mock*
# store (`pub use mock as default`), so writes return Ok and reads return
# Ok(None) and nothing ever reaches the OS keychain. See
# docs/backlog/2026-08-04-keyring-mock-backend.md. Each optional backend dep is
# target-gated inside keyring, so naming all three here is safe on every
# platform: a Linux build simply has no security-framework to pull.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
image = "0.25"

# profile_lock.rs (A-M1): Argon2id KDF + zeroizing password wrapper for the
# profile soft-lock. rand_core/getrandom is argon2's salt RNG — not pulled in
# by argon2's own default features, so it's listed explicitly.
argon2 = "0.5"
secrecy = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "fs"] }
opendal = { version = "0.55", features = ["services-s3", "services-fs", "services-ftp", "services-webdav", "blocking"] }

# Plugin/hook system (spec 2026-06-12): user-script runtime + manifest parsing.
# `sync` makes rhai types Send+Sync so engines can live behind the event bus's
# dispatch thread boundary.
rhai = { version = "1", features = ["sync"] }
toml = "0.8"

# Archive / parser support
zip = "2"
quick-xml = "0.41"
ammonia = "4"
unrar = "0.5"
pdfium-render = { version = "0.8", features = ["image"] }

# libmobi FFI (#34 MOBI/AZW/AZW3 support)
bindgen = "0.71"
pkg-config = "0.3"

# Dev
tempfile = "3"
