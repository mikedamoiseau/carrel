[package]
name = "folio"
version.workspace = true
description = "A Tauri App"
authors = ["you"]
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
folio-core = { path = "../folio-core" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
zip = "2"
quick-xml = "0.36"
ammonia = "4"
base64 = "0.22"
form_urlencoded = "1"
pdfium-render = { version = "0.8", features = ["image"] }
image = "0.25"
dirs = "5"
sha2 = "0.10"
unrar = "0.5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
opendal = { version = "0.55", features = ["services-s3", "services-fs", "services-ftp", "services-webdav", "blocking"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "fs", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
keyring = "3"
secrecy = { workspace = true }
regex = "1"
semver = "1"
url = "2"
urlencoding = "2"
log = "0.4.29"
tauri-plugin-clipboard-manager = "2.3.2"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
mime_guess = "2"
qrcode = "0.14"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-aptabase = "1"
open = "5"
tauri-plugin-webdriver-automation = "0.1.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication"] }
# statfs + MNT_LOCAL for detecting network-mounted book files (source-cache).
libc = "0.2"

[dev-dependencies]
tempfile = "3"
folio-core = { path = "../folio-core", features = ["test-utils"] }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "test"] }
tokio = { version = "1", features = ["macros"] }
wiremock = "0.6"

[features]
default = ["sftp"]
# Delegate to folio-core's sftp feature since `backup` now lives in the core
# crate (#63 M5). Keeping the desktop flag as a convenience pass-through.
sftp = ["folio-core/sftp"]
# MOBI/AZW/AZW3 support (#34). Opt-in because libmobi (LGPL v3+) must be
# available at build time via pkg-config or LIBMOBI_*_DIR env vars. CI on
# Linux installs libmobi-dev via apt (see .github/workflows/ci.yml);
# locally, enable with `cargo … --features mobi`.
mobi = ["folio-core/mobi"]

