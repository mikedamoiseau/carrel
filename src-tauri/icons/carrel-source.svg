<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf8"></stop>
      <stop offset="100%" stop-color="#f0e3cd"></stop>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2714e"></stop>
      <stop offset="100%" stop-color="#96502f"></stop>
    </linearGradient>
    <linearGradient id="inkDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d08c68"></stop>
      <stop offset="100%" stop-color="#b1683f"></stop>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"></stop>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.15"></stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#7a4326" flood-opacity="0.22"></feDropShadow>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#tile)"></rect>
  <rect x="6" y="6" width="1012" height="1012" rx="224" fill="none" stroke="url(#edge)" stroke-width="12"></rect>

  <g filter="url(#glyphShadow)">
    <rect x="336" y="252" width="100" height="256" rx="28" fill="url(#ink)"></rect>
    <rect x="456" y="252" width="100" height="256" rx="28" fill="url(#inkDim)"></rect>
    <g transform="rotate(11 672 508)">
      <rect x="576" y="270" width="100" height="238" rx="28" fill="url(#ink)"></rect>
    </g>
    <rect x="240" y="546" width="544" height="92" rx="32" fill="url(#ink)"></rect>
    <rect x="290" y="638" width="80" height="152" rx="28" fill="url(#inkDim)"></rect>
    <rect x="654" y="638" width="80" height="152" rx="28" fill="url(#inkDim)"></rect>
  </g>
</svg>